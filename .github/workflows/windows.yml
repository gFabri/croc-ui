name: Build Windows

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache de Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Compilar release
        run: cargo build --release

      - name: Empaquetar aplicación
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/croc-ui.exe dist/croc-ui.exe
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/croc-ui.exe, dist/README.md -DestinationPath croc-ui-windows-x64.zip
          (Get-FileHash croc-ui-windows-x64.zip -Algorithm SHA256).Hash | Out-File croc-ui-windows-x64.sha256 -Encoding ascii

      - name: Publicar paquete Windows
        uses: actions/upload-artifact@v4
        with:
          name: croc-ui-windows-x64
          path: |
            croc-ui-windows-x64.zip
            croc-ui-windows-x64.sha256
          if-no-files-found: error
